name: .NET Core Desktop

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: microsoft/setup-msbuild@v2

      - name: Compute build identity
        id: version
        shell: pwsh
        run: ./scripts/Get-BuildVersion.ps1 -RunNumber $env:GITHUB_RUN_NUMBER -RunAttempt $env:GITHUB_RUN_ATTEMPT -Commit $env:GITHUB_SHA -OutputPath $env:GITHUB_OUTPUT

      - name: Test versioning
        shell: pwsh
        run: ./Tests/BuildVersion.Tests.ps1

      - name: Test analytics build routing
        shell: pwsh
        run: ./Tests/AnalyticsBuild.Tests.ps1

      - name: Run regression checks
        shell: pwsh
        run: |
          Get-ChildItem Tests -Recurse -Filter *.csproj | ForEach-Object {
            Write-Host "Running regression checks: $($_.FullName)"
            dotnet run --project $_.FullName -c Release
            $testExitCode = $LASTEXITCODE
            if ($testExitCode -ne 0) {
              $exitCodeBits = [BitConverter]::ToUInt32([BitConverter]::GetBytes([int]$testExitCode), 0)
              throw ("Regression checks failed: {0} (exit code {1}, 0x{2:X8})" -f $_.Name, $testExitCode, $exitCodeBits)
            }
          }

      - name: Publish the application
        working-directory: LockScreenGif
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
          BUILD_IDENTITY: ${{ steps.version.outputs.informational_version }}
        shell: pwsh
        run: |
          dotnet publish -c Release -p:PublishProfile=FolderProfile.pubxml "-p:Version=$env:BUILD_VERSION" "-p:AssemblyVersion=$env:BUILD_VERSION.0" "-p:FileVersion=$env:BUILD_VERSION.0" "-p:InformationalVersion=$env:BUILD_IDENTITY" -p:IncludeSourceRevisionInInformationalVersion=false
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed' }
          $exe = Get-Item '../artifacts/app/LockscreenGif.exe'
          if ($exe.VersionInfo.ProductVersion -ne $env:BUILD_IDENTITY) { throw 'Built app version does not match this run' }

      - name: Verify privileged helper packaging
        shell: pwsh
        run: ./scripts/Test-PrivilegedPackaging.ps1

      - name: Test release packaging
        shell: pwsh
        run: ./Tests/ReleasePackaging.Tests.ps1

      - name: Build MSI installer
        uses: caphyon/advinst-github-action@v2.0
        with:
          advinst-version: '23.3'
          advinst-enable-automation: 'true'
          aip-path: ${{ github.workspace }}\Installer\LockscreenGif.aip
          aip-build-name: DefaultBuild
          aip-package-name: installLockscreenGif.msi
          aip-output-dir: ${{ github.workspace }}\setup
          aip-commands: |
            SetVersion ${{ steps.version.outputs.version }}

      - name: Package release assets
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Compress-Archive -Path 'artifacts/app/*' -DestinationPath "release-assets/LockscreenGif-$env:BUILD_VERSION-win-x64.zip"
          Copy-Item 'setup/installLockscreenGif.msi' "release-assets/LockscreenGif-$env:BUILD_VERSION-x64.msi"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release-assets/*
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 14

  prerelease:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets
          merge-multiple: true
      - name: Generate changelog and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          # A rerun must not replace assets after master has moved on.
          if [[ "$GITHUB_RUN_ATTEMPT" != '1' ]]; then
            git fetch --no-tags origin '+refs/heads/master:refs/remotes/origin/master'
            if [[ "$(git rev-parse refs/remotes/origin/master)" != "$GITHUB_SHA" ]]; then
              echo "::notice::Skipping stale release rerun for $GITHUB_SHA"
              exit 0
            fi
          fi
          # Never repoint an existing build tag to a different checkout.
          if git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          fi
          previous_tag="$(git tag --merged "$GITHUB_SHA" --list 'build-*' --sort=-version:refname |
            grep -E '^build-[0-9]+$' | grep -Fvx "$RELEASE_TAG" | head -n 1 || true)"
          if [[ -n "$previous_tag" && "${previous_tag#build-}" -gt "$GITHUB_RUN_NUMBER" ]]; then
            echo "::notice::Skipping build older than $previous_tag"
            exit 0
          fi
          commit_range="$GITHUB_SHA"
          if [[ -n "$previous_tag" ]]; then commit_range="$previous_tag..$GITHUB_SHA"; fi
          notes="$RUNNER_TEMP/lockscreen-release-notes.md"
          {
            printf 'Automated build **%s**, app version **%s**.\n\n' "$GITHUB_RUN_NUMBER" "$BUILD_VERSION"
            printf 'Source: [`%s`](%s/%s/commit/%s).\n\n' "${GITHUB_SHA::12}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            if [[ -n "$previous_tag" ]]; then
              printf 'Changes since [%s](%s/%s/compare/%s...%s):\n\n' "$previous_tag" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$previous_tag" "$GITHUB_SHA"
            fi
            git log "$commit_range" --first-parent --pretty=format:'- %s (`%h`)'
            printf '\n\n### Downloads\n\nRequires Windows 11 24H2 (build 26100) or later, x64, and the .NET 10 Desktop Runtime.\n\n- Windows x64 MSI installer\n- Windows x64 app ZIP\n- SHA256SUMS for verification\n'
            printf '\nThe app logs its version, commit and build attempt at startup and displays them on the Diagnostics screen.\n'
          } > "$notes"
          (cd release-assets && sha256sum *.zip *.msi > SHA256SUMS)
          assets=("release-assets/LockscreenGif-$BUILD_VERSION-win-x64.zip" "release-assets/LockscreenGif-$BUILD_VERSION-x64.msi" release-assets/SHA256SUMS)
          for asset in "${assets[@]}"; do test -s "$asset"; done
          title="Lockscreen Gif build $GITHUB_RUN_NUMBER (${GITHUB_SHA::12})"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" --prerelease --latest=false --title "$title" --notes-file "$notes"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --prerelease --latest=false \
              --target "$GITHUB_SHA" --title "$title" --notes-file "$notes"
          fi
